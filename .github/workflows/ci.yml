name: CI

on: [push, pull-request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run tests
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build
